const IGN=l=>"https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/"+(l.includes("ORTHO")?"jpeg":"png")+"&LAYER="+l+"&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";
const BASES=[
 {n:"Plan IGN",u:IGN("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2"),a:"© IGN – Géoplateforme"},
 {n:"Satellite IGN",u:IGN("ORTHOIMAGERY.ORTHOPHOTOS"),a:"© IGN – Géoplateforme"},
 {n:"Plan Esri",u:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",a:"© Esri, HERE, Garmin, OpenStreetMap contributors"},
 {n:"OpenStreetMap France",u:"https://tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",a:"© OpenStreetMap France, © contributeurs OpenStreetMap"}];
let base=null,bi=0,errs=0;
const sel=document.createElement("select");sel.setAttribute("aria-label","Fond de carte");BASES.forEach((b,i)=>sel.add(new Option(b.n,i)));
function setBase(i){if(base)map.removeLayer(base);bi=i;errs=0;sel.value=i;const b=BASES[i];
  base=L.tileLayer(b.u,{maxZoom:19,attribution:b.a}).addTo(map);base.bringToBack();
  base.on("tileerror",()=>{if(++errs===4&&i<BASES.length-1&&bi===i)setBase(i+1)})}
sel.onchange=()=>setBase(+sel.value);setBase(0);
const T=D.tracks;
// Traces concentriques (25 km large, 7 km fin) ; liseré blanc dans un pane dédié ; un groupe par parcours (affichable/masquable)
map.createPane("cas");map.getPane("cas").style.zIndex=395;
const COURSES=[["25","#111111",10,14,"25 km"],["15","#00b8e6",6.5,10,"15 km"],["7","#7ed321",3,6,"7 km"]];
const cg={};let l25;
COURSES.forEach(([k,c,w,wc,n])=>{
  const g=L.layerGroup().addTo(map);cg[k]=g;
  L.polyline(T[k],{pane:"cas",color:"#fff",weight:k==="25"?wc:w+3,opacity:.95,lineCap:"round",lineJoin:"round",interactive:false}).addTo(g);
  const l=L.polyline(T[k],{color:c,weight:w,opacity:1,lineCap:"round",lineJoin:"round"}).addTo(g).bindTooltip(n);
  if(k==="25")l25=l});
map.fitBounds(l25.getBounds().pad(.04));
function icon(cat,filled,size=24){const c=CAT[cat].c;
  return L.divIcon({className:"mk",iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-10],
   html:`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled?c:'#fff'}" stroke="${filled?'#fff':c}" stroke-width="${filled?1.8:3}">${SH[CAT[cat].s]}</svg>`})}
const groups={};Object.keys(CAT).forEach(k=>groups[k]=L.layerGroup().addTo(map));
D.posts.forEach(p=>{
  const got=p.nb-p.miss, filled=p.miss===0;
  const pop=`<div class="pop"><h4>${p.id} · ${p.cat}</h4><p><b>${esc(p.titre)}</b></p><p>${esc(p.desc)}</p>
   <p><b>PK par course :</b><br>${p.races.map(r=>r+" km : PK "+(p.passes[r]||[]).map(x=>String(x).replace(".",",")).join(" / ")).join("<br>")}<br>En place ${p.enp} · libération ${p.lib}</p>
   <p>Requis : ${p.nb}${p.assumed?" (supposé)":""}${p.nb_opt?" + 1 optionnel (25 km)":""}${p.pm?" · police municipale":""} · ${p.miss?`<span class="miss">Manque ${p.miss}</span>`:'<span class="ok">Complet</span>'}</p>
   <p>Affectés : ${p.ass.length?p.ass.map(esc).join(", "):"personne pour l'instant"}</p>
   ${p.relay?`<p><i>${esc(p.relay)}</i></p>`:""}${p.materiel.length?`<p>Matériel : ${p.materiel.map(esc).join(" ; ")}</p>`:""}</div>`;
  L.marker([p.lat,p.lon],{icon:icon(p.cat,filled),title:p.id+" – "+p.titre}).bindPopup(pop,{maxWidth:340})
   .bindTooltip(p.id,{permanent:true,direction:"right",offset:[10,0],className:"pid"}).addTo(groups[p.cat]);
});
const POL=L.divIcon({className:"mk",iconSize:[32,34],iconAnchor:[16,17],popupAnchor:[0,-14],
 html:'<svg width="32" height="34" viewBox="0 0 32 34"><path d="M16 1.5L29 6v10c0 8-5.5 13.5-13 16.5C8.5 29.500 3 24 3 16V6Z" fill="#1f6fd1" stroke="#fff" stroke-width="2"/><path d="M16 8l2.200 4.700 5.100.600-3.800 3.500 1 5.100L16 19.300l-4.500 2.600 1-5.100-3.800-3.500 5.100-.6Z" fill="#fff"/></svg>'});
D.pm.forEach((q,i)=>L.marker([q.lat,q.lon],{icon:POL,title:"Police municipale"}).bindPopup("<b>Police municipale</b><br>Présence à confirmer (demande d'intervention).").addTo(groups["Police municipale"]));
// ravitaillements (positions : waypoint « Ravitaillement » du GPX ; Aqueduc = barrières d'entrée/sortie ; Fort = entrée du fort, à ajuster)
const RAV=[
 {n:"Ravito Beffe",lat:45.800982,lon:4.729657,c:"#0a9396",t:"6 jerricans + 2 d'avance",d:"Les coureurs arrivent d'un coup : ce n'est ni le lieu ni le moment de ralentir le flux."},
 {n:"Ravito Aqueduc (arrivée)",lat:45.811673,lon:4.754865,c:"#0a9396",t:"4 jerricans + 2 d'avance",d:"C'est la fin : s'il manque un peu d'eau ou s'il y a la queue, les gens peuvent patienter."},
 {n:"Fort du Paillet",lat:45.8247,lon:4.7482,c:"#9aa5a8",t:"Pas de ravito",d:"Vraiment aucun intérêt, à moins qu'il fasse plus de 30 °C ce matin-là."}];
const rIcon=c=>L.divIcon({className:"mk",iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-12],
 html:'<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="'+c+'" stroke="#fff" stroke-width="2"/><path d="M15 6.500C15 6.500 9.500 13 9.500 16.500a5.500 5.500 0 0 0 11 0C20.500 13 15 6.500 15 6.500Z" fill="#fff"/></svg>'});
const ravG=L.layerGroup().addTo(map);
RAV.forEach(r=>L.marker([r.lat,r.lon],{icon:rIcon(r.c),title:r.n}).bindPopup('<div class="pop"><h4>'+esc(r.n)+'</h4><p><b>'+esc(r.t)+'</b></p><p>'+esc(r.d)+'</p></div>',{maxWidth:300})
 .bindTooltip(r.n,{permanent:true,direction:"right",offset:[12,0],className:"pid"}).addTo(ravG));
// matériel (désactivé par défaut)
const matG=L.layerGroup();
D.mat.forEach(m=>L.circleMarker([m.lat,m.lon],{radius:5,color:"#222",weight:1,fillColor:"#bbb",fillOpacity:.9}).bindTooltip(esc(m.t)+" ("+m.near+", "+m.dist+" m)").addTo(matG));
const bar=document.getElementById("bar");
Object.keys(CAT).forEach(k=>{
  const n=k==="Police municipale"?D.pm.length:D.posts.filter(p=>p.cat===k).length;
  const b=document.createElement("button");b.className="f";b.style.setProperty("--c",CAT[k].c);
  b.innerHTML=k==="Police municipale"?`<svg width="16" height="17" viewBox="0 0 32 34"><path d="M16 1.5L29 6v10c0 8-5.5 13.5-13 16.5C8.5 29.500 3 24 3 16V6Z" fill="#1f6fd1"/><path d="M16 8l2.200 4.700 5.100.600-3.800 3.500 1 5.100L16 19.300l-4.500 2.600 1-5.100-3.800-3.500 5.100-.6Z" fill="#fff"/></svg>${k} (${n})`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="${CAT[k].c}">${SH[CAT[k].s]}</svg>${k} (${n})`;
  b.onclick=()=>{const on=map.hasLayer(groups[k]);on?map.removeLayer(groups[k]):groups[k].addTo(map);b.classList.toggle("off",on)};bar.appendChild(b)});
const rb=document.createElement("button");rb.className="f";rb.style.setProperty("--c","#0a9396");
rb.innerHTML='<svg width="16" height="16" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#0a9396"/><path d="M15 6.500C15 6.500 9.500 13 9.500 16.500a5.500 5.500 0 0 0 11 0C20.500 13 15 6.500 15 6.500Z" fill="#fff"/></svg>Ravitos (3)';
rb.onclick=()=>{const on=map.hasLayer(ravG);on?map.removeLayer(ravG):ravG.addTo(map);rb.classList.toggle("off",on)};bar.appendChild(rb);
COURSES.forEach(([k,c,w,wc,n])=>{const b=document.createElement("button");b.className="f";b.style.setProperty("--c",c);
 b.innerHTML='<span style="display:inline-block;width:22px;height:'+Math.max(w-1,3)+'px;background:'+c+';border-radius:3px"></span>Parcours '+n;
 b.onclick=()=>{const on=map.hasLayer(cg[k]);on?map.removeLayer(cg[k]):cg[k].addTo(map);b.classList.toggle("off",on)};bar.appendChild(b)});
const mb=document.createElement("button");mb.className="f off";mb.style.setProperty("--c","#777");mb.textContent="Matériel et flèches ("+D.mat.length+")";
mb.onclick=()=>{const on=map.hasLayer(matG);on?map.removeLayer(matG):matG.addTo(map);mb.classList.toggle("off",on)};bar.appendChild(mb);
bar.appendChild(sel);
const lg=L.control({position:"bottomleft"});lg.onAdd=()=>{const d=L.DomUtil.create("div","lg");d.innerHTML="<span style=\'color:#111;font-weight:700\'>■ noir : 25 km</span> · <span style=\'color:#00a0cc;font-weight:700\'>■ cyan : 15 km</span> · <span style=\'color:#5aa500;font-weight:700\'>■ vert : 7 km</span> (tracés superposés sur les portions communes)<br>Symbole plein : poste complet · creux : signaleur(s) manquant(s)<br>Tracés v2.7 · positions du GPX « carte organisation »";return d};lg.addTo(map);
</script></body></html>
